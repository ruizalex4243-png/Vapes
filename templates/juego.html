<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vaporhaus Arcade</title>
    <style>
        body { 
            margin: 0; 
            background-color: #0a0a0f; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            flex-direction: column; 
            overflow: hidden; 
            font-family: 'Arial', sans-serif;
        }
        
        #game-container {
            position: relative;
        }

        canvas { 
            border: 2px solid #00f2fe; 
            box-shadow: 0 0 15px #00f2fe; 
            /* Fondo neón */
            background: url('https://static.vecteezy.com/system/resources/previews/003/776/240/non_2x/blurred-colorful-holographic-background-in-neon-colors-trendy-wallpaper-foil-texture-vector.jpg') no-repeat center center; 
            background-size: cover; 
            max-width: 100vw; 
            max-height: 80vh;
            display: block;
        }

        /* Pantalla de inicio para habilitar el audio */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #btn-jugar {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            background: #ff007f;
            color: white;
            border: 2px solid white;
            box-shadow: 0 0 15px #ff007f;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 8px;
            transition: transform 0.2s;
        }

        #btn-jugar:active { transform: scale(0.95); }
        
        .btn-volver { 
            margin-top: 20px; 
            padding: 10px 20px; 
            background: #ff3232; 
            color: white; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 5px; 
            text-transform: uppercase;
        }

        .instrucciones {
            color: #39ff14;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="instrucciones">
        <h2>🎮 Vaporhaus Arcade</h2>
        <p>Usa las flechas o <strong>arrastra el dedo</strong></p>
    </div>
    
    <div id="game-container">
        <div id="start-screen">
            <h1 style="color: #00f2fe; text-shadow: 0 0 10px #00f2fe;">¿Listo para jugar?</h1>
            <button id="btn-jugar">EMPEZAR</button>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    
    <a href="/" class="btn-volver">Volver a la tienda</a>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const startScreen = document.getElementById("start-screen");
        const btnJugar = document.getElementById("btn-jugar");

        // --- 1. CARGA DE IMÁGENES (Enlaces estables de prueba) ---
        // Para usar tus propias imágenes, te recomiendo subirlas a Imgur (copiando el enlace directo que termina en .png) 
        // o usar rutas locales como: src = "imagenes/canasta.png"
        const imgJugador = new Image();
        imgJugador.crossOrigin = "Anonymous"; 
        imgJugador.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Empty_Basket.png/320px-Empty_Basket.png"; 

        const imgVape = new Image();
        imgVape.crossOrigin = "Anonymous";
        imgVape.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Vaporizer_icon.svg/200px-Vaporizer_icon.svg.png"; 

        // --- 2. SINTETIZADOR DE AUDIO (¡Nunca falla ni requiere descargas!) ---
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'punto') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
                osc.start(); osc.stop(audioCtx.currentTime + 1);
            }
        }

        let score = 0;
        let vidas = 3;
        let nivel = 1;
        let game_over = false;
        let animFrame;

        // Jugador
        const jugador = { x: 350, y: 500, width: 80, height: 80, speed: 7 };
        
        // Elementos cayendo
        let vapes = [];
        let vapeSpeed = 3;

        // --- 3. CONTROLES DE TECLADO (PC) ---
        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener("keydown", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        });

        // --- 4. CONTROLES TÁCTILES (MÓVIL) ---
        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault(); 
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width; 
            const touchX = (e.touches[0].clientX - rect.left) * scaleX;
            
            jugador.x = touchX - (jugador.width / 2);

            if (jugador.x < 0) jugador.x = 0;
            if (jugador.x > canvas.width - jugador.width) jugador.x = canvas.width - jugador.width;
        }, { passive: false });

        function spawnVape() {
            if (Math.random() < 0.02 + (nivel * 0.005)) {
                vapes.push({ x: Math.random() * (canvas.width - 40), y: -50, width: 40, height: 60 });
            }
        }

        function draw() {
            if (game_over) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = "#ff3232";
                ctx.font = "bold 60px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, 300);
                ctx.fillStyle = "white";
                ctx.font = "30px Arial";
                ctx.fillText(`Puntos Finales: ${score}`, canvas.width / 2, 360);
                
                // Mostrar botón de reinicio
                startScreen.style.display = "flex";
                btnJugar.innerText = "VOLVER A JUGAR";
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Marcadores
            ctx.textAlign = "left";
            ctx.fillStyle = "#39ff14"; ctx.font = "bold 24px Arial"; ctx.fillText(`PTS: ${score}`, 20, 40);
            ctx.fillStyle = "#ff3232"; ctx.fillText(`VIDAS: ${vidas}`, 20, 70);
            ctx.fillStyle = "#00f2fe"; ctx.textAlign = "right"; ctx.fillText(`NIVEL: ${nivel}`, canvas.width - 20, 40);

            // Mover jugador
            if (rightPressed && jugador.x < canvas.width - jugador.width) jugador.x += jugador.speed;
            else if (leftPressed && jugador.x > 0) jugador.x -= jugador.speed;
            
            // Dibujar Jugador
            if (imgJugador.complete && imgJugador.naturalHeight !== 0) {
                ctx.drawImage(imgJugador, jugador.x, jugador.y, jugador.width, jugador.height);
            } else {
                ctx.fillStyle = "white";
                ctx.fillRect(jugador.x, jugador.y, jugador.width, jugador.height);
            }

            // Vapes
            spawnVape();
            for (let i = 0; i < vapes.length; i++) {
                let v = vapes[i];
                v.y += vapeSpeed;
                
                // Dibujar Vape
                if (imgVape.complete && imgVape.naturalHeight !== 0) {
                    ctx.drawImage(imgVape, v.x, v.y, v.width, v.height);
                } else {
                    ctx.fillStyle = "#00f2fe";
                    ctx.fillRect(v.x, v.y, v.width, v.height);
                }

                // Colisión
                if (v.x < jugador.x + jugador.width && v.x + v.width > jugador.x &&
                    v.y < jugador.y + jugador.height && v.y + v.height > jugador.y) {
                    
                    playSound('punto'); // Sonido exitoso
                    score += 10;
                    if (score > 0 && score % 100 === 0) { nivel++; vapeSpeed += 0.5; }
                    vapes.splice(i, 1);
                    i--;
                } 
                // Fuera de pantalla
                else if (v.y > canvas.height) {
                    vidas--;
                    vapes.splice(i, 1);
                    i--;
                    if (vidas <= 0) {
                        game_over = true;
                        playSound('gameover'); // Sonido perder
                    }
                }
            }
            animFrame = requestAnimationFrame(draw);
        }
        
        // Botón Jugar (Inicia variables, activa audio y arranca el loop)
        btnJugar.addEventListener("click", () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            startScreen.style.display = "none";
            
            // Reiniciar variables
            score = 0;
            vidas = 3;
            nivel = 1;
            vapeSpeed = 3;
            vapes = [];
            game_over = false;
            jugador.x = (canvas.width / 2) - (jugador.width / 2);
            
            cancelAnimationFrame(animFrame);
            draw();
        });
    </script>
</body>
</html>
