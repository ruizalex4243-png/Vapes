{% extends 'base.html' %}

{% block body %}
<div class="container text-center mb-5 fade-in">
    <h1 class="fw-bold text-white">REFERENCIAS <span style="color: #ff007f;">REALES</span></h1>
    <p class="text-muted">¡La familia Vapor Haus sigue creciendo y respaldando nuestra calidad!</p>
</div>

<div class="container mb-5">
    <div class="row g-4 justify-content-center">
        
        <div class="col-md-4 fade-in delay-1">
            <div class="glass p-2 h-100 d-flex flex-column align-items-center justify-content-center" style="border-top: 3px solid var(--lima); transition: transform 0.3s ease;" onmouseover="this.style.transform='translateY(-10px)'" onmouseout="this.style.transform='translateY(0)'">
                <img src="https://m.media-amazon.com/images/I/61vLpOywhuL._AC_UY200_.jpg" alt="Referencia Cliente 1" class="img-fluid rounded shadow-lg" style="max-height: 450px; object-fit: cover;">
                <div class="mt-3" style="color: #FFD700; font-size: 1.2rem;">⭐⭐⭐⭐⭐</div>
                <strong class="text-white mt-1">Cliente Satisfecho</strong>
            </div>
        </div>

        <div class="col-md-4 fade-in delay-2">
            <div class="glass p-2 h-100 d-flex flex-column align-items-center justify-content-center" style="border-top: 3px solid var(--mora); transition: transform 0.3s ease;" onmouseover="this.style.transform='translateY(-10px)'" onmouseout="this.style.transform='translateY(0)'">
                <img src="https://cdn.milenio.com/uploads/media/2023/09/02/cantante-originario-neza-instagram-elbogueto.jpg" alt="Referencia Cliente 2" class="img-fluid rounded shadow-lg" style="max-height: 450px; object-fit: cover;">
                <div class="mt-3" style="color: #FFD700; font-size: 1.2rem;">⭐⭐⭐⭐⭐</div>
                <strong class="text-white mt-1">Compra Verificada</strong>
            </div>
        </div>

        <div class="col-md-4 fade-in delay-3">
            <div class="glass p-2 h-100 d-flex flex-column align-items-center justify-content-center" style="border-top: 3px solid var(--mango); transition: transform 0.3s ease;" onmouseover="this.style.transform='translateY(-10px)'" onmouseout="this.style.transform='translateY(0)'">
                 <img src="https://i.pinimg.com/1200x/6d/e5/89/6de5899adf0d2fa503169a860f64101a.jpg" alt="Referencia Cliente 3" class="img-fluid rounded shadow-lg" style="max-height: 450px; object-fit: cover;">
                <div class="mt-3" style="color: #FFD700; font-size: 1.2rem;">⭐⭐⭐⭐⭐</div>
                <strong class="text-white mt-1">Entrega Rápida</strong>
            </div>
        </div>

    </div>
</div>
{% endblock %}
